{% extends "base.html" %}{% block content %}
<div class="employee-form-shell"><a href="{% if employee %}/employees/{{ employee.id }}{% else %}/employees{% endif %}" class="employee-back">← Вернуться в справочник</a><section class="panel p-4"><span class="eyebrow">Карточка сотрудника</span><h1 class="h3">{% if employee %}Редактирование{% else %}Новый сотрудник{% endif %}</h1><p class="muted">Заполните основные рабочие данные. ФИО — обязательное поле.</p><form method="post" action="{% if employee %}/employees/{{ employee.id }}{% else %}/employees{% endif %}" class="row g-4"><div class="col-12"><label class="form-label">ФИО *</label><input class="form-control form-control-lg" name="full_name" required value="{{ employee.full_name if employee else '' }}"></div><div class="col-md-6"><label class="form-label">Должность</label><input class="form-control" name="position" value="{{ employee.position or '' if employee else '' }}"></div><div class="col-md-6"><label class="form-label">Подразделение</label><input class="form-control" name="department" value="{{ employee.department or '' if employee else '' }}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ employee.email or '' if employee else '' }}"></div><div class="col-md-3"><label class="form-label">Bitrix user ID</label><input class="form-control" type="number" name="bitrix_user_id" value="{{ employee.bitrix_user_id or '' if employee else '' }}"></div><div class="col-md-3"><label class="form-label">Источник</label><select class="form-select" name="source_system">{% for value,label in [('manual','Ручной'),('database','База данных'),('bitrix','Bitrix24')] %}<option value="{{ value }}" {% if employee and employee.source_system == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col-12 d-flex gap-2 justify-content-end"><a class="btn btn-ghost" href="/employees">Отмена</a><button class="btn btn-primary">Сохранить сотрудника</button></div></form></section></div>
{% endblock %}
