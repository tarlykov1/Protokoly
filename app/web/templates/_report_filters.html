<form class="report-panel report-filter" method="get" aria-label="Фильтры отчёта">
  <label>Период с<input class="form-control" type="date" name="period_start" value="{{ dataset.query.period_start or '' }}"></label>
  <label>по<input class="form-control" type="date" name="period_end" value="{{ dataset.query.period_end or '' }}"></label>
  <label>Тип документа<select class="form-select" name="document_type"><option value="all">Все</option><option value="protocol" {% if dataset.query.document_type=='protocol' %}selected{% endif %}>Протокол</option><option value="memo" {% if dataset.query.document_type=='memo' %}selected{% endif %}>МЕМО</option></select></label>
  <label>Проект<select class="form-select" name="project_id" multiple size="1" aria-label="Выберите проекты"><option value="">Все</option>{% for p in projects %}<option value="{{ p.id }}" {% if p.id in dataset.query.project_ids %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></label>
  <label>Мероприятие<input class="form-control" name="event" value="{{ dataset.query.event or '' }}" placeholder="Название"></label>
  <label>Исполнитель<input class="form-control" name="assignee" value="{{ dataset.query.assignee or '' }}" placeholder="ФИО"></label>
  <label>Подразделение / группа<input class="form-control" name="department" value="{{ dataset.query.department or '' }}"></label>
  <label>Вид мероприятия<input class="form-control" name="event_type" value="{{ request.query_params.get('event_type','') }}" placeholder="Все виды"></label>
  <label>Контролёр<input class="form-control" name="controller" value="{{ request.query_params.get('controller','') }}" placeholder="ФИО"></label>
  <label>Статус<select class="form-select" name="task_status"><option value="">Все</option>{% for value,label in [('completed_in_time','Выполнено в срок'),('completed_late','Выполнено с нарушением срока'),('overdue','Просрочено'),('in_progress','В работе')] %}<option value="{{ value }}" {% if dataset.query.task_status==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
  <div class="report-checks"><label><input type="checkbox" name="overdue" value="true" {% if dataset.query.overdue %}checked{% endif %}> Только просроченные</label><label><input type="checkbox" name="problem_only" value="true" {% if dataset.query.problem_only %}checked{% endif %}> Только проблемные</label><label><input type="checkbox" name="include_deferred" value="true" {% if dataset.query.include_deferred %}checked{% endif %}> Включать отложенные</label><label><input type="checkbox" name="weekly" value="true" {% if dataset.query.weekly %}checked{% endif %}> Методология периода</label></div>
  <div class="report-filter-actions"><button class="btn btn-primary">Применить</button><a class="btn btn-outline-secondary" href="{{ request.url.path }}">Сбросить</a></div>
</form>
