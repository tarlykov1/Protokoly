<article draggable="true" class="task-row {{ 'has-errors' if errors }}" data-task-id="{{ task.id }}">
  <div class="task-rail"><button class="drag-handle" title="Перетащить" aria-label="Перетащить поручение">⠿</button><input class="task-select" type="checkbox" aria-label="Выбрать поручение {{ task.number }}"><input class="task-number" value="{{ task.number }}" aria-label="Номер поручения"></div>
  <div class="task-content"><div class="task-error {% if not errors %}d-none{% endif %}" role="alert">⚠ {{ errors|join(' · ') }}</div><input class="task-title" value="{{ task.title }}" aria-label="Текст поручения"><textarea class="task-description" rows="2" placeholder="Добавить полный текст…">{{ task.description or '' }}</textarea>
    <div class="assignee-chips"><span class="field-icon">♙</span><div><small>Конкретные сотрудники</small><select class="task-employees form-select" multiple aria-label="Исполнители">{% for employee in employees %}<option value="{{ employee.id }}" {% if employee.id in task.assignments|selectattr('source_participant_group_id','none')|map(attribute='employee_id')|list %}selected{% endif %}>{{ employee.full_name }}</option>{% endfor %}</select></div><span class="assignee-or">или</span><div><small>Группа участников</small><select class="task-group form-select" aria-label="Группа исполнителей"><option value="">Не выбрана</option>{% for group in participant_groups %}<option value="{{ group.id }}" {% if group.id in task.assignments|map(attribute='source_participant_group_id')|list %}selected{% endif %}>{{ group.name }} ({{ group.members|length }})</option>{% endfor %}</select></div>{% for assignment in task.assignments if not assignment.employee_id %}<button class="memo-assignee chip chip-error" data-source-name="{{ assignment.individual_title }}">MEMO: {{ assignment.individual_title }}</button>{% endfor %}</div>
    <div class="task-meta"><label><span>📅 Срок</span><input class="task-deadline form-control" type="date" value="{{ task.deadline or '' }}"></label><label><span>Раздел</span><select class="task-section form-select">{% for section in sections %}<option value="{{ section.id }}" {% if task.section_id == section.id %}selected{% endif %}>{{ section.title }}</option>{% endfor %}<option value="">Без раздела</option></select></label><label><span>Приоритет</span><select class="task-priority form-select"><option value="">Обычный</option><option value="low" {% if task.priority == 'low' %}selected{% endif %}>Низкий</option><option value="high" {% if task.priority == 'high' %}selected{% endif %}>Высокий</option></select></label><label><span>Создание задачи</span><select class="task-mode form-select"><option value="independent">Отдельная</option><option value="subtasks" {% if task.create_as_subtasks %}selected{% endif %}>Подзадача</option></select></label><label class="control-toggle"><input class="task-controlled" type="checkbox" {% if task.is_controlled %}checked{% endif %}><span>Контроль</span></label></div>
  </div><div class="task-actions action-buttons"><button class="edit-task" title="Редактировать" aria-label="Редактировать">✎</button><button class="duplicate-task" title="Дублировать">⧉</button><button class="delete-task" title="Удалить">×</button></div>
</article>
