<tr class="task-row {{ 'has-errors' if errors }}" data-task-id="{{ task.id }}"><td data-label="Выбор"><input class="task-select" type="checkbox" aria-label="Выбрать поручение {{ task.number }}">{% if errors %}<span class="error-dot" title="{{ errors|join(', ') }}">!</span>{% endif %}</td><td data-label="№"><input class="task-number form-control form-control-sm" value="{{ task.number }}"></td><td data-label="Поручение"><input class="task-title form-control form-control-sm" value="{{ task.title }}"><textarea class="task-description form-control form-control-sm text-clamp" rows="2" placeholder="Полный текст">{{ task.description or '' }}</textarea></td><td data-label="Исполнители"><select class="task-employees form-select form-select-sm" multiple aria-label="Исполнители">{% for employee in employees %}<option value="{{ employee.id }}" {% if employee.id in task.assignments|map(attribute='employee_id')|list %}selected{% endif %}>{{ employee.full_name }}</option>{% endfor %}</select>{% for assignment in task.assignments if not assignment.employee_id %}<button class="memo-assignee btn btn-sm btn-outline-danger" data-source-name="{{ assignment.individual_title }}">МЕМО: {{ assignment.individual_title }}</button>{% endfor %}</td><td data-label="Срок"><input class="task-deadline form-control form-control-sm" type="date" value="{{ task.deadline or '' }}"></td><td data-label="Раздел"><select class="task-section form-select form-select-sm">{% for section in sections %}<option value="{{ section.id }}" {% if task.section_id == section.id %}selected{% endif %}>{{ section.title }}</option>{% endfor %}</select></td><td data-label="Приоритет"><select class="task-priority form-select form-select-sm"><option value="">Обычный</option>{% for value,label in [('low','Низкий'),('high','Высокий')] %}<option value="{{ value }}" {% if task.priority == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></td><td data-label="Режим"><select class="task-mode form-select form-select-sm"><option value="independent">Отдельные</option><option value="subtasks" {% if task.create_as_subtasks %}selected{% endif %}>Подзадачи</option></select></td><td data-label="Контроль"><input class="task-controlled" type="checkbox" {% if task.is_controlled %}checked{% endif %}></td><td data-label="Действия"><button class="duplicate-task btn btn-sm" title="Дублировать">⧉</button><button class="delete-task btn btn-sm text-danger" title="Удалить">×</button></td></tr>
