<article draggable="true" class="task-row {{ 'has-errors' if errors }}" data-task-id="{{ task.id }}">
  <div class="task-rail"><button class="drag-handle" title="Перетащить" aria-label="Перетащить поручение">⠿</button><input class="task-select" type="checkbox" aria-label="Выбрать поручение {{ task.number }}"><input class="task-number" value="{{ task.number }}" aria-label="Номер поручения"></div>
  <div class="task-content"><div class="task-error {% if not errors %}d-none{% endif %}" role="alert">⚠ {{ errors|join(' · ') }}</div><input class="task-title" value="{{ task.title }}" aria-label="Текст поручения"><textarea class="task-description" rows="2" placeholder="Добавить полный текст…">{{ task.description or '' }}</textarea>
    <div class="assignee-chips"><span class="field-icon">♙</span><div><small>Исполнители · Сотрудники</small><select class="task-employees form-select" multiple aria-label="Исполнители">{% for employee in employees %}<option value="{{ employee.id }}" data-bitrix-user-id="{{ employee.bitrix_user_id or '' }}" {% if employee.id in task.assignments|selectattr('source_participant_group_id','none')|map(attribute='employee_id')|list %}selected{% endif %}>{{ employee.full_name }}</option>{% endfor %}</select></div><span class="assignee-or">и</span><div><small>Исполнители · Списки участников</small><select class="task-groups form-select" multiple aria-label="Списки исполнителей">{% set selected_group_ids = task.participant_group_selections|map(attribute='participant_group_id')|list %}{% for group in participant_groups %}<option value="{{ group.id }}" data-member-ids="{{ group.members|map(attribute='employee_id')|join(',') }}" {% if group.id in selected_group_ids %}selected{% endif %}>{{ group.name }} ({{ group.members|length }})</option>{% endfor %}</select></div><strong class="task-assignee-count" aria-live="polite"></strong>{% if protocol.source_type == 'docx_import' %}{% for assignment in task.assignments if not assignment.employee_id %}<span class="chip chip-error" role="alert">Пользователь не найден: {{ assignment.individual_title }}</span><button type="button" class="memo-assignee btn btn-sm btn-outline-primary" data-source-name="{{ assignment.individual_title }}">Выбрать сотрудника</button><button type="button" class="create-memo-assignee btn btn-sm btn-outline-primary" data-source-name="{{ assignment.individual_title }}">Создать сотрудника</button>{% endfor %}{% endif %}</div>
    <div class="task-meta"><label><span>📅 Срок</span><input class="task-deadline form-control" type="date" value="{{ task.deadline or '' }}"></label><label><span>Раздел</span><select class="task-section form-select">{% for section in sections %}<option value="{{ section.id }}" {% if task.section_id == section.id %}selected{% endif %}>{{ section.title }}</option>{% endfor %}<option value="">Без раздела</option></select></label><label><span>Приоритет</span><select class="task-priority form-select"><option value="">Обычный</option><option value="low" {% if task.priority == 'low' %}selected{% endif %}>Низкий</option><option value="high" {% if task.priority == 'high' %}selected{% endif %}>Высокий</option></select></label><label><span>Создание задачи</span><select class="task-mode form-select"><option value="independent">Отдельная</option><option value="subtasks" {% if task.create_as_subtasks %}selected{% endif %}>Подзадача</option></select></label><label class="control-toggle"><input class="task-controlled" type="checkbox" {% if task.is_controlled %}checked{% endif %}><span>Контроль</span></label></div><div class="parent-task-field {{ '' if task.create_as_subtasks else 'd-none' }}"><label><span>Родительская задача</span><input class="parent-task-search form-control" type="search" placeholder="Найти по названию"></label><select class="task-parent form-select"><option value="">Выберите родительскую задачу</option>{% for candidate in protocol.tasks if candidate.id != task.id %}<option value="{{ candidate.id }}" {% if task.parent_task_id == candidate.id %}selected{% endif %}>{{ candidate.title }}</option>{% endfor %}</select></div>
  </div><div class="task-actions action-buttons"><button class="duplicate-task" type="button" title="Дублировать" aria-label="Дублировать">⧉</button><button class="delete-task" type="button" title="Удалить" aria-label="Удалить">×</button></div>
</article>
