name: CI

on:
  push:
    branches:
      - main
      - work
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: protocol_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d protocol_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/protocol_management_test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d protocol_management_test && exit 0
            sleep 1
          done
          exit 1

      - name: Set up Node for editor tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Test editor behavior
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Run Ruff
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Show current migration
        run: alembic current

      - name: Show migration heads
        run: alembic heads

      - name: Run pytest
        run: pytest -q

      - name: Check application import
        run: python -c "import app.main; print('import ok')"

      - name: Start application
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/protocol-management.log 2>&1 &
          echo $! > /tmp/protocol-management.pid

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/protocol-management.log
          exit 1

      - name: Check HTTP pages
        run: |
          curl --fail --silent http://127.0.0.1:8000/health > /dev/null
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          curl --fail --silent http://127.0.0.1:8000/demo > /dev/null
          curl --fail --silent http://127.0.0.1:8000/demo/dashboard > /dev/null
          curl --fail --silent http://127.0.0.1:8000/protocols > /dev/null
          curl --fail --silent http://127.0.0.1:8000/protocols/import > /dev/null
          curl --fail --silent http://127.0.0.1:8000/protocols/imports > /dev/null
          curl --fail --silent http://127.0.0.1:8000/publication-runs > /dev/null

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/protocol-management.pid ]; then
            kill "$(cat /tmp/protocol-management.pid)" || true
          fi

  docker-desktop-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated test credentials
        run: |
          mkdir -p .local/secrets
          python - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('database_password', 'encryption_key', 'local_password'):
              Path('.local/secrets', name).write_bytes(base64.urlsafe_b64encode(os.urandom(32)))
          PY
      - name: Build and start the actual stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check migrations, authentication and worker
        run: |
          curl --fail --silent http://localhost:8000/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/settings/integrations)" = "401"
          python - <<'PY'
          import base64, urllib.request
          from pathlib import Path
          password = Path('.local/secrets/local_password').read_text().strip()
          token = base64.b64encode(('local:' + password).encode()).decode()
          request = urllib.request.Request('http://localhost:8000/settings/integrations', headers={'Authorization': 'Basic ' + token})
          assert urllib.request.urlopen(request).status == 200
          PY
          docker compose exec -T web python -m alembic current
          docker compose exec -T worker python -c 'from app.services.tasks.jobs import run_next; assert run_next() is False'
          docker compose restart web worker
          docker compose up -d --wait --wait-timeout 60
          curl --fail --silent http://localhost:8000/ready
      - name: Stack logs
        if: failure()
        run: docker compose logs --tail=150
      - name: Stop isolated stack
        if: always()
        run: docker compose down -v
